name: CI
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realworld
          POSTGRES_PASSWORD: realworld
          POSTGRES_DB: realworld
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U realworld"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://realworld:realworld@localhost:5432/realworld
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v7

        with:
          name: coverage
          path: coverage/
  secrets-scan:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  quality:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 #v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  container-scan:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: realworld:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Varredura com Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v.0.36.0
        with:
          image-ref: realworld:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Salva a imagem aprovada
        run: docker save realworld:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
  build-push:
    needs: container-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - name: Carrega a imagem aprovada pelo Trivy
        run: docker load < image.tar.gz
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag e push
        id: push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SRC="realworld:${GITHUB_SHA}"
          docker tag "$SRC" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker tag "$SRC" "$IMAGE:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$SRC" "$IMAGE:$GITHUB_REF_NAME"
          fi
          docker push --all-tags "$IMAGE"
          echo "image=$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
